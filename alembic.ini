# Alembic для VETMO. URL миграций переопределяется через VETMO_DATABASE_URL.
[alembic]
script_location = src/vetmo/data/migrations
file_template = %%(rev)s
prepend_sys_path = src
sqlalchemy.url = sqlite:///vetmo.db

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
